name: Platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Import application
        run: python -c "import sys; sys.path.insert(0, 'app'); import main"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Render dev manifests
        run: kubectl kustomize k8s/overlays/dev > /tmp/dev.yaml

      - name: Render prod manifests
        run: kubectl kustomize k8s/overlays/prod > /tmp/prod.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/platform-app

      - name: Render Helm chart
        run: helm template platform-app helm/platform-app > /tmp/helm.yaml

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: platform-app:ci
          load: true

      - name: Scan container OS packages
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: platform-app:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os
          scanners: vuln

      - name: Scan Python dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: app
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: library
          scanners: vuln

      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: k8s
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Scan Helm configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: config
          scan-ref: helm/platform-app
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
